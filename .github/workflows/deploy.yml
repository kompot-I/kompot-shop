# Публикация сайта на GitHub Pages при каждом push в main.
# Основа — официальный шаблон из документации Vite (vite.dev/guide/static-deploy),
# версии действий закреплены по хэшам коммитов.
#
# Сборка и публикация разнесены на два job'а. В одном job'е deploy-pages иногда
# запрашивает список артефактов через полсекунды после загрузки и не находит его
# ("No artifacts named github-pages were found"); граница между job'ами даёт паузу.
#
# Один раз вручную: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Можно запустить вручную: вкладка Actions → этот workflow → Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выкатывается только одна версия
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Тесты включают проверку public/products.json: если в каталоге опечатка,
      # на сайт он не попадёт, а в Actions будет видно, какой товар и поле не так.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    # Запускается только после успешной сборки. Если упадёт именно он, на вкладке
    # запуска жмите «Re-run failed jobs»: пересоберётся только публикация.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5